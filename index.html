        // 輔助函數：洗牌與平均分配選項
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateBalancedQuestions(pool, targetCount) {
            let extendedPool = [];
            while (extendedPool.length < targetCount) {
                let shuffled = shuffleArray(pool);
                extendedPool = extendedPool.concat(shuffled);
            }
            extendedPool = extendedPool.slice(0, targetCount);

            // 平均分配答案位置 (0:A, 1:B, 2:C, 3:D)
            let targetAnsDistribution = [
                Math.ceil(targetCount / 4),
                Math.floor(targetCount / 4),
                Math.floor(targetCount / 4),
                Math.floor(targetCount / 4)
            ];
            while(targetAnsDistribution.reduce((a,b)=>a+b, 0) < targetCount) {
                targetAnsDistribution[0]++;
            }

            let assignedAns = [];
            for(let i=0; i<4; i++) {
                for(let j=0; j<targetAnsDistribution[i]; j++) {
                    assignedAns.push(i);
                }
            }
            assignedAns = shuffleArray(assignedAns);

            return extendedPool.map((item, idx) => {
                let originalOpts = [...item.opts];
                let correctText = originalOpts[item.ans];
                
                let wrongOpts = originalOpts.filter((_, i) => i !== item.ans);
                wrongOpts = shuffleArray(wrongOpts);

                let finalOpts = [];
                let desiredCorrectIdx = assignedAns[idx];

                let wIdx = 0;
                for(let i=0; i<4; i++) {
                    if(i === desiredCorrectIdx) {
                        finalOpts.push(correctText);
                    } else {
                        finalOpts.push(wrongOpts[wIdx++]);
                    }
                }

                return {
                    q: item.q,
                    opts: finalOpts,
                    ans: desiredCorrectIdx,
                    url: item.url || null
                };
            });
        }

                        <h1 class="text-3xl sm:text-5xl font-black text-purple-900 mb-3 tracking-tight">🎭 歌劇停看聽 🎵</h1>
                        <p class="text-slate-600 text-sm sm:text-base mb-8 max-w-lg mx-auto">挑戰 50 道精選歌劇闖關題目！橫跨歌劇起源、大師經典與精彩樂曲欣賞，快來測試你的音樂實力吧！</p>
                        
                        <div class="bg-purple-50/70 p-6 rounded-2xl max-w-sm mx-auto mb-8 border border-purple-100 text-left">
                            <label class="block text-slate-700 font-bold mb-2 text-sm">請輸入 5 位數字（前三碼班級 + 兩碼座號）：</label>
                            <input type="text" id="input-student-id" maxlength="5" placeholder="例如：80105" 
                                class="w-full px-4 py-3 bg-white border border-purple-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-lg text-center tracking-widest font-bold text-purple-900 shadow-inner"
                                value="${currentUser.studentId}">
                            <p class="text-xs text-slate-400 mt-2 text-center">例：80105 代表 801班 05號</p>
                        </div>

                        <!-- 開始挑戰按鈕：白色、放大、置中 -->
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                            <button onclick="startGame()" class="w-full sm:w-80 bg-white hover:bg-purple-50 text-purple-700 hover:text-purple-800 font-black text-xl py-5 rounded-2xl shadow-xl shadow-purple-200 border-2 border-purple-200 transition transform hover:-translate-y-0.5">
                                開始挑戰
                            </button>
                        </div>

                        <div class="mt-6">
                            <button onclick="goToTeacherLogin()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm px-6 py-3 rounded-xl transition">
                                👨‍🏫 教師後台登入
                            </button>
                        </div>
                    </div>
                `;
            } else if (gameState === 'playing') {
                let currentQ = levelQuestions[currentQuestionIndex];
                let totalQInLevel = levelQuestions.length;
                let progressPercent = ((currentQuestionIndex) / totalQInLevel) * 100;

                app.innerHTML = `
                    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl border border-purple-100 animate-fade-in my-auto">
                        <div class="flex flex-wrap justify-between items-center mb-6 gap-2">
                            <div class="flex items-center gap-2">
                                <span class="bg-purple-600 text-white font-bold px-3 py-1 rounded-xl text-sm">第 ${currentLevel} 關</span>
                                <span class="text-slate-500 text-sm font-medium">進度：第 ${currentQuestionIndex + 1} / ${totalQInLevel} 題</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="text-xs sm:text-sm font-bold text-purple-700 bg-purple-100 px-3 py-1 rounded-xl">座號：${currentUser.studentId}</span>
                                <div id="timer-display" class="text-xs sm:text-sm font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-xl">⏱️ 00:00</div>
                            </div>
                        </div>

                        <div class="w-full bg-purple-100 h-2.5 rounded-full mb-6 overflow-hidden">
                            <div class="bg-purple-600 h-full transition-all duration-300 rounded-full" style="width: ${progressPercent}%"></div>
                        </div>

                        ${currentQ.url ? `
                            <div class="mb-6 rounded-2xl overflow-hidden shadow-lg border border-purple-100 bg-black aspect-video max-w-lg mx-auto flex items-center justify-center">
                                <video src="${currentQ.url}" controls autoplay class="w-full h-full object-contain"></video>
                            </div>
                        ` : ''}

                        <h2 class="text-lg sm:text-2xl font-bold text-slate-900 mb-6 leading-snug text-center">${currentQ.q}</h2>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                            ${currentQ.opts.map((opt, idx) => `
                                <button onclick="handleAnswer(${idx})" class="group text-left p-4 sm:p-5 rounded-2xl border-2 border-purple-100 hover:border-purple-500 hover:bg-purple-50/50 bg-white transition shadow-sm flex items-center gap-4">
                                    <span class="w-8 h-8 rounded-xl bg-purple-100 group-hover:bg-purple-600 group-hover:text-white text-purple-700 font-bold flex items-center justify-center transition shrink-0">
                                        ${['A', 'B', 'C', 'D'][idx]}
                                    </span>
                                    <span class="text-slate-700 font-medium text-base sm:text-lg">${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (gameState === 'certificate') {
                app.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-2xl border-4 border-amber-300 text-center animate-fade-in my-auto relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 text-8xl select-none opacity-20 font-black">🏆</div>
                        <div class="inline-block bg-amber-100 text-amber-800 font-bold px-4 py-1.5 rounded-full text-sm mb-3">恭喜通關！</div>
                        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-2">🎓 歌劇達人結業證書 🎓</h1>
                        <p class="text-slate-500 text-sm mb-6">特此證明 <strong>${currentUser.studentId}</strong> 同學成功完成 50 題歌劇全關卡挑戰！</p>

                        <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-6 max-w-sm mx-auto mb-8 shadow-inner">
                            <div class="text-slate-600 text-sm mb-1">總花費時間</div>
                            <div id="final-time" class="text-3xl font-black text-amber-600">00:00</div>
                        </div>

                        <button onclick="backToHome()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-lg px-8 py-3.5 rounded-2xl shadow-xl shadow-purple-200 transition">
                            返回首頁重新挑戰
                        </button>
                    </div>
                `;
                stopTimer();
                let mins = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
                let secs = (elapsedTime % 60).toString().padStart(2, '0');
                document.getElementById('final-time').innerText = `${mins}分 ${secs}秒`;
            } else if (gameState === 'teacher_login') {
                app.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-purple-100 max-w-md mx-auto animate-fade-in my-auto">
                        <h2 class="text-2xl font-black text-slate-900 mb-2 text-center">👨‍🏫 教師後台登入</h2>
                        <p class="text-slate-500 text-sm mb-6 text-center">請輸入教師後台管理密碼</p>
                        
                        <div class="mb-6">
                            <input type="password" id="input-teacher-pass" placeholder="預設密碼：admin" 
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-center font-bold">
                        </div>

                        <div class="flex gap-3">
                            <button onclick="verifyTeacherLogin()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-purple-200">
                                登入後台
                            </button>
                            <button onclick="backToHome()" class="px-5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition">
                                返回
                            </button>
                        </div>
                    </div>
                `;
            } else if (gameState === 'teacher_dashboard') {
                app.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-purple-100 animate-fade-in my-auto">
                        <div class="flex flex-wrap justify-between items-center mb-6 gap-4 border-b pb-4">
                            <div>
                                <h2 class="text-2xl font-black text-slate-900">📊 教師後台 錯題分析系統</h2>
                                <p class="text-slate-500 text-sm">依各班級錯題次數排序與統計</p>
                            </div>
                            <button onclick="backToHome()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg text-xs transition">
                                登出返回
                            </button>
                        </div>

                        <!-- 系統設定面板 -->
                        <div class="bg-purple-50/50 border border-purple-100 p-4 rounded-2xl mb-6 flex flex-wrap gap-4 items-center justify-between">
                            <div class="flex items-center gap-2">
                                <input type="password" id="new-pass" placeholder="輸入新後台密碼" class="px-3 py-1.5 bg-white border border-purple-200 rounded-lg text-xs font-medium">
                                <button onclick="changePassword()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-md shadow-purple-100">
                                    儲存密碼
                                </button>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="clearAllCloudData()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-md shadow-red-100">
                                    🗑️ 清除所有數據
                                </button>
                                <button onclick="loadTeacherData()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                                    🔄 重新整理
                                </button>
                            </div>
                        </div>

                        <!-- 錯題列表 -->
                        <div id="error-table-container" class="overflow-x-auto max-h-96 overflow-y-auto rounded-2xl border border-slate-100">
                            <div class="text-center py-10 text-slate-400">正在讀取雲端錯題數據...</div>
                        </div>
                    </div>
                `;
                loadTeacherData();
            }
        }

        // ==================== 遊戲邏輯函數 ====================
        function startGame() {
            const studentIdInput = document.getElementById('input-student-id').value.trim();
            if (studentIdInput.length !== 5 || isNaN(studentIdInput)) {
                showModal("格式錯誤", "請輸入完整的 5 位數字座號（例如：80105）！", "⚠️");
                return;
            }
            currentUser.studentId = studentIdInput;
            currentUser.classId = studentIdInput.substring(0, 3);

            levelQuestions = generateBalancedQuestions(rawPoolLevel1, 15);
            currentLevel = 1;
            currentQuestionIndex = 0;
            score = 0;

            elapsedTime = 0;
            gameState = 'playing';
            render();
            startTimer();
        }

        function startTimer() {
            stopTimer();
            startTime = Date.now() - (elapsedTime * 1000);
            timerInterval = setInterval(() => {
                elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                let mins = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
                let secs = (elapsedTime % 60).toString().padStart(2, '0');
                let timerEl = document.getElementById('timer-display');
                if (timerEl) {
                    timerEl.innerText = `⏱️ ${mins}:${secs}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function handleAnswer(selectedIndex) {
            let currentQ = levelQuestions[currentQuestionIndex];
            let isCorrect = (selectedIndex === currentQ.ans);

            if (isCorrect) {
                currentQuestionIndex++;
                if (currentQuestionIndex >= levelQuestions.length) {
                    if (currentLevel === 1) {
                        currentLevel = 2;
                        levelQuestions = generateBalancedQuestions(rawPoolLevel2, 15);
                        currentQuestionIndex = 0;
                        showModal("🎉 第一關通關！", "太棒了！準備進入第二關：歌劇著名作品！", "👏");
                    } else if (currentLevel === 2) {
                        currentLevel = 3;
                        let shuffledVideo = shuffleArray(videoDatabase);
                        levelQuestions = generateBalancedQuestions(shuffledVideo, 20);
                        currentQuestionIndex = 0;
                        showModal("🎉 第二關通關！", "太厲害了！準備進入第三關：辨識歌劇著名樂曲與角色！", "🏆");
                    } else {
                        gameState = 'certificate';
                        render();
                        return;
                    }
                }
                render();
            } else {
                let userAnsText = currentQ.opts[selectedIndex];
                let correctAnsText = currentQ.opts[currentQ.ans];
                
                // 1. 保留原有的 Firebase 錯題紀錄上傳
                uploadErrorLog(currentQ.q, userAnsText, correctAnsText);

                // 2. 傳送錯題與轉換後的中文關卡至 Google 試算表對應班級分頁
                sendWrongAnswerToSheet(
                    currentUser.studentId,
                    currentUser.classId,
                    "level" + currentLevel,
                    currentQ.q,
                    userAnsText,
                    correctAnsText
                );

                showModal("❌ 答錯囉！", `正確答案是：【${['A','B','C','D'][currentQ.ans]}】${correctAnsText}\n\n規則說明：答錯 1 題該關卡需重新挑戰，題目已重新洗牌！`, "😢");
                
                if (currentLevel === 1) {
                    levelQuestions = generateBalancedQuestions(rawPoolLevel1, 15);
                } else if (currentLevel === 2) {
                    levelQuestions = generateBalancedQuestions(rawPoolLevel2, 15);
                } else {
                    levelQuestions = generateBalancedQuestions(videoDatabase, 20);
                }
                currentQuestionIndex = 0;
                render();
            }
        }

        // ==================== Google 試算表錯題與關卡回傳 ====================
        function sendWrongAnswerToSheet(studentId, classId, currentLevel, questionText, userAnswerText, correctAnswerText) {
            var levelMap = {
                "level1": "第一關",
                "level2": "第二關",
                "level3": "第三關",
                "1": "第一關",
                "2": "第二關",
                "3": "第三關"
            };
            var translatedLevel = levelMap[currentLevel] || currentLevel;

            // 確保班級代號永遠精準取自座號前 3 碼（801 ~ 819 皆適用）
            var cleanStudentId = (studentId || "").toString().trim();
            var cleanClassId = cleanStudentId.length >= 3 ? cleanStudentId.substring(0, 3) : (classId || "未填班級");

            var postData = {
                studentId: cleanStudentId || "未填座號",
                classId: cleanClassId,
                level: translatedLevel,
                stage: translatedLevel,
                question: questionText,
                userAnswer: userAnswerText,
                correctAnswer: correctAnswerText
            };

            // 使用 text/plain;charset=utf-8 搭配 no-cors，避免瀏覽器阻擋跨網域請求
            fetch("https://script.google.com/macros/s/AKfycbw7VIEldTXuf5eKHcn4ANGaB9CeMXw0DrMkhm9V69B68FhiBXnVOp7uaTDz-rcZd1X0/exec", {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(postData)
            }).then(() => {
                console.log("已送出班級錯題：", cleanClassId, translatedLevel);
            }).catch(error => {
                console.error("回傳失敗：", error);
            });
        }

        // ==================== Firebase 雲端錯誤紀錄 ====================
        function uploadErrorLog(questionText, userAnswer, correctAnswer) {
            if (!db) return;
            db.collection('errorLogs').add({
                studentId: currentUser.studentId,
                classId: currentUser.classId,
                question: questionText,
                userAnswer: userAnswer,
                correctAnswer: correctAnswer,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(err => {
                console.warn("錯題上傳提示：", err);
            });
        }

        // ==================== 教師後台相關函數 ====================
        function goToTeacherLogin() {
            gameState = 'teacher_login';
            render();
        }

        function verifyTeacherLogin() {
            let pass = document.getElementById('input-teacher-pass').value;
            if (pass === teacherPassword) {
                gameState = 'teacher_dashboard';
                render();
            } else {
                showModal("密碼錯誤", "請輸入正確的教師後台密碼！", "🔒");
            }
        }

        function changePassword() {
            let newPass = document.getElementById('new-pass').value.trim();
            if (newPass.length < 3) {
                showModal("密碼太短", "新密碼長度至少需要 3 個字元！", "⚠️");
                return;
            }
            teacherPassword = newPass;
            localStorage.setItem('teacher_pass', newPass);
            showModal("修改成功", "教師後台登入密碼已成功更新！", "✅");
            document.getElementById('new-pass').value = '';
        }

        function clearAllCloudData() {
            if (!db) {
                showModal("提示", "雲端資料庫尚未連線", "ℹ️");
                return;
            }
            if (confirm("確定要清除雲端所有學生的錯題紀錄嗎？此動作無法復原！")) {
                db.collection('errorLogs').get().then(snapshot => {
                    let batch = db.batch();
                    snapshot.docs.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    return batch.commit();
                }).then(() => {
                    showModal("清除成功", "雲端所有錯題數據已全數清空！", "🧹");
                    loadTeacherData();
                }).catch(err => {
                    showModal("清除失敗", "清除數據時發生錯誤：" + err.message, "❌");
                });
            }
        }

        function loadTeacherData() {
            const container = document.getElementById('error-table-container');
            if (!db) {
                container.innerHTML = `<div class="text-center py-10 text-red-500 font-medium">雲端資料庫未連線</div>`;
                return;
            }

            db.collection('errorLogs').get().then(snapshot => {
                if (snapshot.empty) {
                    container.innerHTML = `<div class="text-center py-10 text-slate-400 font-medium">目前尚無任何學生上傳的錯題紀錄</div>`;
                    return;
                }

                let questionStats = {};
                snapshot.docs.forEach(doc => {
                    let data = doc.data();
                    let qText = data.question || "未知題目";
                    let cAns = data.correctAnswer || "未知答案";
                    let cId = data.classId || "未分類";

                    let key = qText + "___" + cAns;
                    if (!questionStats[key]) {
                        questionStats[key] = { question: qText, correctAnswer: cAns, totalErrors: 0, classes: {} };
                    }
                    questionStats[key].totalErrors++;
                    questionStats[key].classes[cId] = (questionStats[key].classes[cId] || 0) + 1;
                });

                let sortedStats = Object.values(questionStats).sort((a, b) => b.totalErrors - a.totalErrors);

                let html = `
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-purple-50 text-purple-900 text-xs sm:text-sm uppercase tracking-wider border-b border-purple-100">
                                <th class="p-3.5">排名</th>
                                <th class="p-3.5">錯題內容與正確答案</th>
                                <th class="p-3.5 text-center">總錯題數</th>
                                <th class="p-3.5">各班錯題分佈</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                `;

                sortedStats.forEach((item, index) => {
                    let classDistStr = Object.entries(item.classes)
                        .sort((a,b) => b[1] - a[1])
                        .map(([cls, count]) => `<span class="bg-purple-100 text-purple-800 font-semibold px-2 py-0.5 rounded text-xs mr-1 mb-1 inline-block">${cls}班: ${count}次</span>`)
                        .join('');

                    html += `
                        <tr class="hover:bg-purple-50/30 transition">
                            <td class="p-3.5 font-bold text-slate-500">#${index + 1}</td>
                            <td class="p-3.5 text-slate-800 font-medium max-w-xs sm:max-w-md">
                                <div class="font-bold mb-1">${item.question}</div>
                                <div class="text-xs text-emerald-700 bg-emerald-50 px-2 py-1 rounded inline-block">✅ 正確答案：${item.correctAnswer}</div>
                            </td>
                            <td class="p-3.5 text-center font-black text-purple-700 text-base">${item.totalErrors}</td>
                            <td class="p-3.5">${classDistStr}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            }).catch(err => {
                container.innerHTML = `<div class="text-center py-10 text-red-500 font-medium">無法讀取雲端數據：${err.message}</div>`;
            });
        }

        function backToHome() {
            stopTimer();
            gameState = 'home';
            render();
        }

        // ==================== 彈跳視窗控制 ====================
        function showModal(title, message, icon = "💡") {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
